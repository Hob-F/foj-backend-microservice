spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: foj-backend-user-service
          uri: lb://foj-backend-user-service
          predicates:
            - Path=/api/user/**
        - id: foj-backend-question-service
          uri: lb://foj-backend-question-service
          predicates:
            - Path=/api/question/**
        - id: foj-backend-judge-service
          uri: lb://foj-backend-judge-service
          predicates:
            - Path=/api/judge/**
        - id: foj-ai-service
          uri: lb://foj-ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            # AI 服务控制器映射 /ai/**（非 /api/ai/**），剥掉一层 /api 前缀
            - StripPrefix=1
  application:
    name: foj-backend-gateway
  main:
    web-application-type: reactive
server:
  port: 8121
knife4j:
  gateway:
    # ① 第一个配置，开启gateway聚合组件
    enabled: true
    # ② 第二行配置，设置聚合模式采用discover服务发现的模式
    strategy: discover
    discover:
      # ③ 第三行配置，开启discover模式
      enabled: true
      # ④ 第四行配置，聚合子服务全部为Swagger2规范的文档
      version: swagger2
